services:
  prono:
    # Image published by GitHub Actions on every push to main (requires `docker login ghcr.io`).
    image: ghcr.io/gwenoler/pronos:latest
    container_name: prono
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Optional instance settings (see the README, "Settings"):
      APP_NAME: ${APP_NAME:-}
      APP_SHORT_NAME: ${APP_SHORT_NAME:-}
      APP_LANG: ${APP_LANG:-fr}
      POINTS_REGULAR: ${POINTS_REGULAR:-1}
      POINTS_PLAYOFFS: ${POINTS_PLAYOFFS:-2}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - prono-data:/data
    # Your cloudflared points to http://<server-ip>:3847
    ports:
      - "3847:3000"
    # Alternative: if your cloudflared is on a shared Docker network, uncomment
    # these lines (and the "networks" block at the bottom), remove "ports" and point the tunnel to http://prono:3000
    # networks:
    #   - cloudflared

volumes:
  prono-data:

# networks:
#   cloudflared:
#     external: true
#     name: <your-cloudflared-network-name>
