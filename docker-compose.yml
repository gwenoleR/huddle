services:
  prono:
    # Image publiée par GitHub Actions à chaque push sur main.
    # Pour construire en local à la place : docker compose up -d --build
    image: ghcr.io/gwenoler/pronos:latest
    build: .
    container_name: prono
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Renseigne PUBLIC_URL dans .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - prono-data:/data
    # Le cloudflared de ton infra pointe vers http://<ip-du-serveur>:3847
    ports:
      - "3847:3000"
    # Variante : si ton cloudflared est sur un réseau Docker partagé, décommente
    # ces lignes (et le bloc « networks » en bas), retire « ports » et pointe le tunnel vers http://prono:3000
    # networks:
    #   - cloudflared

volumes:
  prono-data:

# networks:
#   cloudflared:
#     external: true
#     name: <nom-du-réseau-de-ton-cloudflared>
