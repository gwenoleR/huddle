services:
  prono:
    # Image publiée par GitHub Actions à chaque push sur main (nécessite « docker login ghcr.io »).
    image: ghcr.io/gwenoler/pronos:latest
    container_name: prono
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Renseigne PUBLIC_URL dans .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Réglages facultatifs de l'instance (voir le README, « Réglages ») :
      APP_NAME: ${APP_NAME:-}
      APP_SHORT_NAME: ${APP_SHORT_NAME:-}
      APP_LANG: ${APP_LANG:-fr}
      POINTS_REGULAR: ${POINTS_REGULAR:-1}
      POINTS_PLAYOFFS: ${POINTS_PLAYOFFS:-2}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - prono-data:/data
    # Le cloudflared de ton infra pointe vers http://<ip-du-serveur>:3847
    ports:
      - "3847:3000"
    # Variante : si ton cloudflared est sur un réseau Docker partagé, décommente
    # ces lignes (et le bloc « networks » en bas), retire « ports » et pointe le tunnel vers http://prono:3000
    # networks:
    #   - cloudflared

volumes:
  prono-data:

