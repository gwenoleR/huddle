# Huddle: the app alone, on port 3000. Put it behind HTTPS (phones need it to install the app and
# receive notifications): see the README, "HTTPS", or examples/docker-compose.caddy.yml.
#
#   echo "PUBLIC_URL=https://huddle.example.com" > .env
#   docker compose up -d
services:
  huddle:
    # `latest` = the last release. Pin a version with :1 or :1.0, or follow main with :edge.
    image: ghcr.io/gwenoler/huddle:latest
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Optional instance settings (see the README, "Settings"):
      APP_NAME: ${APP_NAME:-}
      APP_SHORT_NAME: ${APP_SHORT_NAME:-}
      APP_LANG: ${APP_LANG:-fr}
      POINTS_REGULAR: ${POINTS_REGULAR:-1}
      POINTS_PLAYOFFS: ${POINTS_PLAYOFFS:-2}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - huddle-data:/data
    ports:
      - "3000:3000"

volumes:
  huddle-data:
