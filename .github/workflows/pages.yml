name: Website

# Builds the website and documentation (site/, VitePress) and publishes it on GitHub Pages:
# https://gwenoler.github.io/huddle/
# Pages must be enabled once in the repository settings: Settings › Pages › Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # GitHub Pages needs a public repository (on a free plan): nothing to publish while it's private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # "last updated" dates on each page
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
