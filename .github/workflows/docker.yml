name: Docker image

# Checks types and runs the tests, then publishes the image to ghcr.io/gwenoler/pronos
# for amd64 and arm64 (Raspberry Pi, Synology, Apple silicon):
# - every push to main → tags `edge` and `sha-<short hash>`, version "1.2.0-edge.abc1234"
# - every tag vX.Y.Z    → tags `X.Y.Z`, `X.Y`, `X`, `latest`, plus a GitHub release
#   whose notes are the matching section of CHANGELOG.md
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Types and tests first: if either fails, nothing is published.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

      # A release tag must match package.json and have its CHANGELOG section.
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > /dev/null

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "app=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "app=$(node -p "require('./package.json').version")-edge.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image name is lowercased: ghcr.io/gwenoler/pronos
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
